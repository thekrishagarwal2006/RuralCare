version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ruralcare_postgres
    environment:
      POSTGRES_DB: ruralcare
      POSTGRES_USER: ruralcare_user
      POSTGRES_PASSWORD: ruralcare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruralcare_user -d ruralcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ruralcare_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruralcare_backend
    environment:
      - DATABASE_URL=postgresql://ruralcare_user:ruralcare_password@postgres:5432/ruralcare
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=ruralcare_secret_key_change_in_production_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruralcare_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
